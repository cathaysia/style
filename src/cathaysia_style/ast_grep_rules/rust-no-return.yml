id: rust-no-return
message: "Convert if block at end of function to early return"
severity: warning
language: rust
rule:
  all:
    - pattern:
        strictness: cst
        context: |
          fn $FUNC($$$PARAMS) {
            $$$BEFORE
            if $COND {
              $$$BODY
            }
          }
    - not:
        pattern:
          strictness: cst
          context: |
            fn $FUNC($$$PARAMS) {
              $$$BEFORE
              if let $PAT = $EXPR {
                $$$BODY
              }
            }

fix: |
  fn $FUNC($$$PARAMS) {
    $$$BEFORE
    if !($COND) {
      return;
    }
    $$$BODY
  }
